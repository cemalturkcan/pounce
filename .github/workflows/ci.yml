name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pdftotext and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg

      - name: Check Google Chrome
        run: google-chrome --version

      - name: Workflow lint
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Quality gates
        run: bun run check

  e2e-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      WEB_AGENT_ENGINE: playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pdftotext and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg

      - name: Check Google Chrome
        run: google-chrome --version

      - name: End-to-end tests on the Playwright engine
        run: bun run test:e2e
