name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: bun run build:binary

      - name: Checksums
        working-directory: dist
        run: sha256sum pounce-linux-x64 pounce-linux-arm64 > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/pounce-linux-x64 dist/pounce-linux-arm64 dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/pounce-linux-x64 dist/pounce-linux-arm64 dist/SHA256SUMS --title "$TAG" --generate-notes --verify-tag
          fi
